name: Test

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "*.toml"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ReusableTest.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      allow_failure: ${{ matrix.allow_failure }}
      run_codecov: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "lts"
          - "1"
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        allow_failure: [false]
        include:
          - version: "lts"
            os: macos-latest
            arch: arm64
            allow_failure: false
          - version: "1"
            os: macos-latest
            arch: arm64
            allow_failure: false
